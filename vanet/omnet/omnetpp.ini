[General]
network = Town04Vanet
seed-set = 1
*.vehicleRange = 40m
*.rsuRange = 220m
record-eventlog = true
result-dir = results
*.annotations.draw = true
*.connectionManager.sendDirect = true
*.connectionManager.maxInterfDist = 1000m
*.connectionManager.drawMaxIntfDist = false
# Live RSUs come from run_rsu.sh via shared bridge snapshots.
*.rsu*.appl.isRsu = true
**.veinsmobility.x = 0
**.veinsmobility.y = 0
**.veinsmobility.z = 0
**.appl.sendBeacons = false
**.appl.dataOnSch = false
**.nic.mac1609_4.useServiceChannel = false
**.nic.mac1609_4.txPower = 20mW
**.nic.mac1609_4.bitrate = 6Mbps
**.nic.phy80211p.minPowerLevel = -110dBm
**.nic.phy80211p.useNoiseFloor = true
**.nic.phy80211p.noiseFloor = -98dBm
**.nic.phy80211p.decider = xmldoc("radio.xml")
**.nic.phy80211p.analogueModels = xmldoc("radio.xml")
**.nic.phy80211p.usePropagationDelay = true
**.nic.phy80211p.antenna = xmldoc("antenna.xml", "/root/Antenna[@id='monopole']")
**.nic.phy80211p.antennaOffsetY = 0m
**.nic.phy80211p.antennaOffsetZ = 0m

[Config Live]
*.manager.smoke = false

[Config Smoke]
*.manager.smoke = true
sim-time-limit = 10s
